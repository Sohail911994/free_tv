name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.27.0"
          cache: true

      - name: Android project
        run: |
          mkdir -p /tmp/keep
          cp -a lib /tmp/keep/lib
          cp pubspec.yaml /tmp/keep/pubspec.yaml
          flutter create --org com.freetv.app --project-name free_tv --platforms android .
          rm -rf lib
          cp -a /tmp/keep/lib lib
          cp /tmp/keep/pubspec.yaml pubspec.yaml

      - name: Set Gradle Version
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-all.zip|' android/gradle/wrapper/gradle-wrapper.properties

      # --- YEH NAYA STEP ADD KIYA HAI ---
      - name: Set Kotlin Version
        run: |
          sed -i 's|id "org.jetbrains.kotlin.android" version ".*" apply false|id "org.jetbrains.kotlin.android" version "2.0.10" apply false|' android/settings.gradle

      - name: Android permissions
        run: python3 tool/patch_android.py

      - name: Packages
        run: flutter pub get

      - name: Fix old Android plugins
        run: python3 tool/patch_plugins.py

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: Free-TV
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
