name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android project
        run: |
          mkdir -p /tmp/keep
          cp -a lib /tmp/keep/lib
          cp pubspec.yaml /tmp/keep/pubspec.yaml
          flutter create --org com.freetv.app --project-name free_tv --platforms android .
          rm -rf lib
          cp -a /tmp/keep/lib lib
          cp /tmp/keep/pubspec.yaml pubspec.yaml

      - name: Force Kotlin Version
        run: |
          # Stable Kotlin version
          if [ -f android/build.gradle ]; then
            sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '2.0.21'/" android/build.gradle
          fi
          if [ -f android/settings.gradle ]; then
            sed -i "s/id \"org.jetbrains.kotlin.android\" version \".*\"/id \"org.jetbrains.kotlin.android\" version \"2.0.21\"/" android/settings.gradle
          fi

      - name: Android permissions
        run: python3 tool/patch_android.py

      - name: Packages
        run: flutter pub get

      - name: Fix old Android plugins
        run: python3 tool/patch_plugins.py

      # --- R8 CRASH FIX ---
      - name: Create ProGuard Rules
        run: |
          echo "-keep class com.jhomlala.better_player.** { *; }" > android/app/proguard-rules.pro
          echo "-keep class androidx.media3.** { *; }" >> android/app/proguard-rules.pro
          echo "-dontwarn com.jhomlala.better_player.**" >> android/app/proguard-rules.pro
          echo "-dontwarn com.google.android.play.core.**" >> android/app/proguard-rules.pro

      - name: Clean Build
        run: flutter clean

      # --- NO SHRINK FIX (App crash nahi hogi) ---
      - name: Build release APK
        run: flutter build apk --release --no-shrink

      - uses: actions/upload-artifact@v4
        with:
          name: Free-TV
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
